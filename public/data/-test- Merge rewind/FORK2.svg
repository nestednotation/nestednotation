  <text x="850" y="660" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">Splits the room again for the barrier-style merge.</text>
  <text x="850" y="738" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">NOTE: a split EXPIRES the merges above —</text>
