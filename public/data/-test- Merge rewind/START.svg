<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1701 2480" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect x="0" y="0" width="1701" height="2480" style="fill:#3a5a78"/>
  <text x="850" y="330" font-size="150" text-anchor="middle" fill="#fff" font-family="sans-serif">START</text>
  <text x="850" y="470" font-size="46" text-anchor="middle" fill="#ffffffcc" font-family="monospace">-test- Merge rewind</text>
  <text x="850" y="660" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">A score for exercising the merge undo. Three devices</text>
  <text x="850" y="738" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">show it best; two still work.</text>
  <text x="850" y="816" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif"></text>
  <text x="850" y="894" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">FORK×3 ▸ A1/B1/C1 ▸ A2/B2/C2 ▸ MERGE1</text>
  <text x="850" y="972" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">MERGE1 ▸ FORK2×3 ▸ D1/E1 and F1 ▸ F2 ▸ BARRIER ▸ MERGE2</text>
  <text x="850" y="1050" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif"></text>
  <text x="850" y="1128" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">MERGE1  lines merge as they arrive: together makes one</text>
  <text x="850" y="1206" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">        merge of three, apart makes two (undo newest</text>
  <text x="850" y="1284" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">        first). Every line lands back on its A2/B2/C2.</text>
  <text x="850" y="1362" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">BARRIER lines merge while PARKED here — that undo is</text>
  <text x="850" y="1440" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">        offered on MERGE2 and lands them back here.</text>
  <text x="850" y="1518" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">MERGE2  carries both: the barrier merge, then the</text>
  <text x="850" y="1596" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">        straggler's. Undo them newest first.</text>
  <text x="850" y="1674" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">A1/B1/C1  a per-line rewind here reaches back PAST the</text>
  <text x="850" y="1752" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">        merge, undoing it on the way.</text>
  <a xlink:href="FORK.svg">
    <rect x="150" y="2020" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="2140" font-size="62" text-anchor="middle" fill="#112" font-family="sans-serif">Begin</text>
    <text x="850" y="2235" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">FORK.svg</text>
  </a>
</svg>
