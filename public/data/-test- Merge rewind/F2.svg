<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1701 2480" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect x="0" y="0" width="1701" height="2480" style="fill:#2f6f52"/>
  <text x="850" y="330" font-size="150" text-anchor="middle" fill="#fff" font-family="sans-serif">F2</text>
  <text x="850" y="470" font-size="46" text-anchor="middle" fill="#ffffffcc" font-family="monospace">the frame BARRIER waits for</text>
  <text x="850" y="660" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">Landing here satisfies session-hold-until,</text>
  <text x="850" y="738" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">so the lines parked on BARRIER are released</text>
  <text x="850" y="816" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">— and merged — while still standing on it.</text>
  <a xlink:href="BARRIER.svg">
    <rect x="150" y="2020" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="2140" font-size="62" text-anchor="middle" fill="#112" font-family="sans-serif">Follow them to the barrier</text>
    <text x="850" y="2235" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">BARRIER.svg</text>
  </a>
</svg>
