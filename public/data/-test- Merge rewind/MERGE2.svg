<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1701 2480" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" holding="20" voting="45">
  <rect x="0" y="0" width="1701" height="2480" style="fill:#6d3060"/>
  <text x="850" y="330" font-size="150" text-anchor="middle" fill="#fff" font-family="sans-serif">MERGE2</text>
  <text x="850" y="470" font-size="46" text-anchor="middle" fill="#ffffffcc" font-family="monospace">where the released lines land</text>
  <text x="850" y="660" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">Both merges are undone from here: the barrier one</text>
  <text x="850" y="738" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">(its lines go back to BARRIER) and the straggler's</text>
  <text x="850" y="816" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">that follows. Newest first — the older entry appears</text>
  <text x="850" y="894" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">once the newer one is undone.</text>
  <a xlink:href="END.svg">
    <rect x="150" y="2020" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="2140" font-size="62" text-anchor="middle" fill="#112" font-family="sans-serif">Finish</text>
    <text x="850" y="2235" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">END.svg</text>
  </a>
</svg>
