    <g transform="matrix(1,0,0,1,-4237,-4671)">
        <g id="_2" serif:id="2" transform="matrix(0.944444,0,0,1.13889,4237,4671)">
            <rect x="0" y="0" width="1800" height="1800" style="fill:none;"/>
            <g transform="matrix(1.05882,0,0,0.878049,-171.264,294.801)">
                <text x="275.647px" y="391.833px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">The idea of &quot;now&quot; is</text>
                <text x="1149.59px" y="391.833px" style="font-family:'Arial-BoldMT', 'Arial', sans-serif;font-weight:700;font-size:96px;">local</text>
                <text x="1368.35px" y="391.833px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">.</text>
                <text x="275.647px" y="590.114px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">Gravity causes time to</text>
                <text x="275.647px" y="689.255px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">move relatively more</text>
                <text x="275.647px" y="788.396px" style="font-family:'Arial-BoldItalicMT', 'Arial', sans-serif;font-weight:700;font-style:italic;font-size:96px;">slowly</text>
                <g transform="matrix(96,0,0,96,595.757,788.396)">
                </g>
                <text x="569.085px" y="788.396px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">.</text>
            </g>
            <g transform="matrix(1.05882,0,0,0.878049,-210.771,-134.442)">
                <text x="275.647px" y="391.833px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">T<tspan x="330.726px 352.054px " y="391.833px 391.833px ">im</tspan>e is</text>
                <text x="608.085px" y="391.833px" style="font-family:'Arial-BoldMT', 'Arial', sans-serif;font-weight:700;font-size:96px;">relative</text>
                <text x="944.319px" y="391.833px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">.</text>
                <text x="275.647px" y="590.114px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">It depends on a</text>
                <text x="964.194px" y="590.114px" style="font-family:'Arial-BoldMT', 'Arial', sans-serif;font-weight:700;font-size:96px;">frame of reference</text>
                <g transform="matrix(96,0,0,96,1828.57,590.114)">
                </g>
                <text x="1801.9px" y="590.114px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">.</text>
            </g>
            <g transform="matrix(1.05882,0,0,0.878049,-169.973,829.176)">
                <text x="275.647px" y="391.833px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">T<tspan x="330.726px 352.054px " y="391.833px 391.833px ">im</tspan>e is</text>
                <text x="608.085px" y="391.833px" style="font-family:'Arial-BoldMT', 'Arial', sans-serif;font-weight:700;font-size:96px;">bidirectional</text>
                <text x="1178.84px" y="391.833px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">.</text>
                <text x="275.647px" y="590.114px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">Except for</text>
                <text x="734.507px" y="590.114px" style="font-family:'Arial-BoldMT', 'Arial', sans-serif;font-weight:700;font-size:96px;">heat</text>
                <text x="958.569px" y="590.114px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">(entropy), the laws</text>
                <text x="275.647px" y="689.255px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">of physics are the same whether</text>
                <text x="275.647px" y="788.396px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">time&apos;s &quot;arrow&quot; moves</text>
                <g transform="matrix(96,0,0,96,1267.99,887.536)">
                </g>
                <text x="275.647px" y="887.536px" style="font-family:'ArialMT', 'Arial', sans-serif;font-size:96px;">forwards or backwards.</text>
            </g>
