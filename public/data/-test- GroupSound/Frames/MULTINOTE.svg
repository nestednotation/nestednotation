<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
  <a href="SINGLE.svg">
    <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
    <text x="500" y="54" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#222" style="pointer-events:none">MULTINOTE — a multi-sound note inside a group</text>

    <!-- Edge case: one member is itself a 2-sound note (Low-B + High-Ab) and
         the other is a 1-sound note (Mid-Eb). The group's "all playing" check
         is per-note (note.isPlaying), so it must pulse only when BOTH notes
         (i.e. all 3 sounds) are playing. -->
    <g id="ChordGroup" groupsound="true">
      <rect x="110" y="100" width="780" height="330" rx="24" fill="#f3e8ff" stroke="#8a3af0" stroke-width="4"/>
      <text x="500" y="142" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#8a3af0" style="pointer-events:none">left note = 2 sounds, right note = 1 sound</text>
      <ellipse cx="330" cy="300" rx="150" ry="92" fill="#8a3af0" sound="Font/2-Low-B,Font/2-High-Ab"/>
      <text x="330" y="296" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#fff" style="pointer-events:none">Low-B + High-Ab</text>
      <text x="330" y="322" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#e7d2ff" style="pointer-events:none">(one note, two sounds)</text>
      <circle cx="690" cy="300" r="82" fill="#a86cf5" sound="Font/2-Mid-Eb"/>
      <text x="690" y="306" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#fff" style="pointer-events:none">Mid-Eb</text>
    </g>

    <text x="500" y="565" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666" style="pointer-events:none">box pulses only when both notes (all 3 sounds) are playing</text>
    <text x="500" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#999" style="pointer-events:none">guide mode: tap to go to SINGLE &#8594;</text>
  </a>
</svg>
