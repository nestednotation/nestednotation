<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
  <a href="DISSOLVE.svg">
    <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
    <text x="500" y="54" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#222" style="pointer-events:none">NESTED-STRUCT — sound notes buried in subgroups</text>

    <!-- Edge case: mirrors the real markup from the proposal (Ring / Notes /
         Root-Marker / Treble-Note). The sound notes sit at different depths
         inside decorative subgroups that have NO sound. groupNode.contains()
         must still find them, and clicking any decoration plays the whole
         group via bubbling. -->
    <g id="ChordGroup" groupsound="true">
      <rect x="110" y="100" width="780" height="360" rx="24" fill="#fdeaf1" stroke="#d6336c" stroke-width="4"/>
      <text x="500" y="138" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#d6336c" style="pointer-events:none">decorations + deeply nested sound notes</text>

      <!-- decorative Ring: no sound, but clicking it still triggers the group -->
      <g id="Ring">
        <circle cx="500" cy="300" r="150" fill="none" stroke="#f1aac3" stroke-width="10"/>
        <g id="Ring">
          <circle cx="500" cy="300" r="120" fill="none" stroke="#f7cdde" stroke-width="6"/>
        </g>
      </g>

      <!-- Notes subgroup: two sound notes one level deep -->
      <g id="Notes">
        <circle cx="380" cy="300" r="62" fill="#d6336c" sound="Font/2-Low-B"/>
        <text x="380" y="306" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" style="pointer-events:none">Low-B</text>
        <circle cx="500" cy="300" r="62" fill="#e35d8a" sound="Font/2-Mid-Eb"/>
        <text x="500" y="306" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" style="pointer-events:none">Mid-Eb</text>
      </g>

      <!-- decorative Root-Marker: no sound -->
      <g id="Root-Marker">
        <rect x="470" y="430" width="60" height="14" rx="6" fill="#d6336c"/>
      </g>

      <!-- Treble-Note: sound note TWO levels deep -->
      <g id="Treble-Note">
        <g>
          <circle cx="620" cy="300" r="62" fill="#ee85a8" sound="Font/2-High-Ab"/>
          <text x="620" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff" style="pointer-events:none">High-Ab</text>
        </g>
      </g>
    </g>

    <text x="500" y="540" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666" style="pointer-events:none">click the outer ring (no sound) — all 3 nested notes still play</text>
    <text x="500" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#999" style="pointer-events:none">play this group, then tap to DISSOLVE &#8594;</text>
  </a>
</svg>
