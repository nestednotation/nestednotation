<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
  <a href="PARTIAL.svg">
    <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
    <text x="500" y="54" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#222" style="pointer-events:none">FRAME-2 — continuation test</text>

    <!-- Same three sounds as the START group. If they were playing when you
         transition from START, the continuation logic keeps them playing and
         this group should already be pulsing (no click needed). -->
    <g id="ChordGroup" groupsound="true">
      <rect x="110" y="100" width="780" height="330" rx="24" fill="#e7f7ec" stroke="#2faa55" stroke-width="4"/>
      <text x="500" y="142" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2faa55" style="pointer-events:none">same 3 sounds — should auto-pulse if carried over</text>
      <circle cx="290" cy="300" r="82" fill="#2faa55" sound="Font/2-Low-B"/>
      <text x="290" y="308" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff" style="pointer-events:none">Low-B</text>
      <circle cx="500" cy="300" r="82" fill="#46c06d" sound="Font/2-Mid-Eb"/>
      <text x="500" y="308" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff" style="pointer-events:none">Mid-Eb</text>
      <circle cx="710" cy="300" r="82" fill="#6fd492" sound="Font/2-High-Ab"/>
      <text x="710" y="308" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff" style="pointer-events:none">High-Ab</text>
    </g>

    <text x="500" y="565" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666" style="pointer-events:none">play this group, then tap to PARTIAL to see continuation drop out</text>
    <text x="500" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#999" style="pointer-events:none">guide mode: tap to go to PARTIAL &#8594;</text>
  </a>
</svg>
