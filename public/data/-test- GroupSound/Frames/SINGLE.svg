<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
  <a href="NESTED-STRUCT.svg">
    <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
    <text x="500" y="54" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#222" style="pointer-events:none">SINGLE — degenerate one-note group</text>

    <!-- Edge case: a group with a single member. Should behave like a normal
         note but driven through the group click + group data-playing path
         (clicking the surrounding box, not just the circle, plays it). -->
    <g id="ChordGroup" groupsound="true">
      <rect x="250" y="120" width="500" height="300" rx="24" fill="#e0f7fa" stroke="#0097a7" stroke-width="4"/>
      <text x="500" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#0097a7" style="pointer-events:none">one-note group</text>
      <circle cx="500" cy="300" r="82" fill="#0097a7" sound="Font/2-Low-G"/>
      <text x="500" y="306" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#fff" style="pointer-events:none">Low-G</text>
    </g>

    <text x="500" y="520" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666" style="pointer-events:none">click the box margin (not the circle) — group still plays it</text>
    <text x="500" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#999" style="pointer-events:none">guide mode: tap to go to NESTED-STRUCT &#8594;</text>
  </a>
</svg>
