<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
  <a href="START.svg">
    <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
    <text x="500" y="54" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#222" style="pointer-events:none">INERT — when groupsound must do nothing</text>

    <!-- Edge case A: groupsound="false" must NOT group. Each note stays
         individually clickable / animates on its own. -->
    <g id="NotAGroup" groupsound="false">
      <rect x="80" y="120" width="380" height="320" rx="24" fill="#eeeeee" stroke="#9e9e9e" stroke-width="4"/>
      <text x="270" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#616161" style="pointer-events:none">groupsound="false"</text>
      <text x="270" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e" style="pointer-events:none">notes click individually</text>
      <circle cx="200" cy="320" r="70" fill="#616161" sound="Font/2-Mid-C"/>
      <text x="200" y="326" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" style="pointer-events:none">Mid-C</text>
      <circle cx="350" cy="320" r="70" fill="#828282" sound="Font/2-Mid-Eb"/>
      <text x="350" y="326" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff" style="pointer-events:none">Mid-Eb</text>
    </g>

    <!-- Edge case B: groupsound="true" with NO sound descendants. It must be
         skipped (no listener, no crash) and simply do nothing on click. -->
    <g id="EmptyGroup" groupsound="true">
      <rect x="540" y="120" width="380" height="320" rx="24" fill="#eef5ee" stroke="#9e9e9e" stroke-width="4" stroke-dasharray="10 8"/>
      <text x="730" y="160" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#616161" style="pointer-events:none">groupsound="true"</text>
      <text x="730" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9e9e9e" style="pointer-events:none">but contains no sounds</text>
      <text x="730" y="320" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#9e9e9e" style="pointer-events:none">click = nothing happens</text>
    </g>

    <text x="500" y="540" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666" style="pointer-events:none">left: two independent notes &#160;&#160;|&#160;&#160; right: inert empty group</text>
    <text x="500" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#999" style="pointer-events:none">guide mode: tap to loop back to START &#8594;</text>
  </a>
</svg>
