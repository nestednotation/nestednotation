<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
  <a href="MULTINOTE.svg">
    <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
    <text x="500" y="54" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#222" style="pointer-events:none">PARTIAL — partial overlap must NOT carry over</text>

    <!-- Edge case: only Low-B and Mid-Eb overlap with FRAME-2's playing group.
         High-Ab is gone and Mid-C is new, so the group does NOT fully carry
         over -> ALL of its sound stops on arrival (no partial carry, no
         pulse). Ungrouped notes would still continue individually. -->
    <g id="ChordGroup" groupsound="true">
      <rect x="110" y="100" width="780" height="330" rx="24" fill="#fff3e0" stroke="#e08a00" stroke-width="4"/>
      <text x="500" y="142" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#e08a00" style="pointer-events:none">only 2 of 3 match FRAME-2 -> ALL sound stops (no partial carry)</text>
      <circle cx="290" cy="300" r="82" fill="#e08a00" sound="Font/2-Low-B"/>
      <text x="290" y="300" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#fff" style="pointer-events:none">Low-B</text>
      <text x="290" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffe8c2" style="pointer-events:none">(carried)</text>
      <circle cx="500" cy="300" r="82" fill="#eda13a" sound="Font/2-Mid-Eb"/>
      <text x="500" y="300" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#fff" style="pointer-events:none">Mid-Eb</text>
      <text x="500" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffe8c2" style="pointer-events:none">(carried)</text>
      <circle cx="710" cy="300" r="82" fill="#f4b86a" sound="Font/2-Mid-C"/>
      <text x="710" y="300" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#fff" style="pointer-events:none">Mid-C</text>
      <text x="710" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffe8c2" style="pointer-events:none">(new)</text>
    </g>

    <text x="500" y="565" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#666" style="pointer-events:none">clicking the box still plays/stops all 3 together as normal</text>
    <text x="500" y="690" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#999" style="pointer-events:none">guide mode: tap to go to MULTINOTE &#8594;</text>
  </a>
</svg>
