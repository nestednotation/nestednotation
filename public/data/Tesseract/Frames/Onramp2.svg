                <text x="5636.76px" y="6165.51px" style="font-family:'MetallophileSp8-Light', 'Metallophile Sp8';font-weight:300;font-size:62.5px;">This color ﬁeld represents the rhythmic context.</text>
                <text x="5849.91px" y="6228.01px" style="font-family:'MetallophileSp8-Light', 'Metallophile Sp8';font-weight:300;font-size:62.5px;">It may automatically play<tspan x="6476.04px " y="6228.01px ">,</tspan> but</text>
