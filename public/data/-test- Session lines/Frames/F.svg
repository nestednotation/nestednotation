<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1701 2480" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" session-hold-until="E.svg,G.svg" session-rejoin-at="H.svg,I.svg">
  <rect x="0" y="0" width="1701" height="2480" style="fill:#9a4aa5"/>
  <text x="850" y="400" font-size="150" text-anchor="middle" fill="#fff" font-family="sans-serif">F ← Tetra2</text>
  <text x="850" y="600" font-size="52" text-anchor="middle" fill="#ffffffcc" font-family="monospace">session-hold-until="E.svg,G.svg"</text>
  <text x="850" y="684" font-size="52" text-anchor="middle" fill="#ffffffcc" font-family="monospace">session-rejoin-at="H.svg,I.svg"</text>
  <text x="850" y="880" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">Back from Tetra2. Waits until E and G are</text>
  <text x="850" y="952" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">reached (rendezvous), then vote a route:</text>
  <text x="850" y="1024" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">join E's line at H, or G's line at I.</text>
  <a xlink:href="H.svg">
    <rect x="150" y="1820" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="1940" font-size="64" text-anchor="middle" fill="#112" font-family="sans-serif">Merge at H</text>
    <text x="850" y="2035" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">H.svg</text>
  </a>
  <a xlink:href="I.svg">
    <rect x="150" y="2160" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="2280" font-size="64" text-anchor="middle" fill="#112" font-family="sans-serif">Merge at I</text>
    <text x="850" y="2375" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">I.svg</text>
  </a>
  <g sound="Mid-B" style="cursor:pointer">
    <circle cx="850" cy="1300" r="110" style="fill:#ffffff22;stroke:#fff;stroke-width:6"/>
    <text x="850" y="1322" font-size="56" text-anchor="middle" fill="#fff" font-family="sans-serif">Mid-B</text>
  </g>
</svg>
