<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" height="100%" viewBox="0 0 1701 2480" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" session-split="3">
  <rect x="0" y="0" width="1701" height="2480" style="fill:#8a5a2a"/>
  <text x="850" y="400" font-size="150" text-anchor="middle" fill="#fff" font-family="sans-serif">A — split ×3</text>
  <text x="850" y="600" font-size="52" text-anchor="middle" fill="#ffffffcc" font-family="monospace">session-split="3"</text>
  <text x="850" y="880" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">Choice window: each device taps a path;</text>
  <text x="850" y="952" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">the room divides into three lines.</text>
  <text x="850" y="1024" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">Non-choosers are balanced automatically.</text>
  <a xlink:href="B.svg">
    <rect x="150" y="1480" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="1600" font-size="64" text-anchor="middle" fill="#112" font-family="sans-serif">Path B — sub-session Tetra1</text>
    <text x="850" y="1695" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">B.svg</text>
  </a>
  <a xlink:href="C.svg">
    <rect x="150" y="1820" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="1940" font-size="64" text-anchor="middle" fill="#112" font-family="sans-serif">Path C — sub-session Tetra2</text>
    <text x="850" y="2035" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">C.svg</text>
  </a>
  <a xlink:href="D.svg">
    <rect x="150" y="2160" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="2280" font-size="64" text-anchor="middle" fill="#112" font-family="sans-serif">Path D — sub-session Cube1</text>
    <text x="850" y="2375" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">D.svg</text>
  </a>
