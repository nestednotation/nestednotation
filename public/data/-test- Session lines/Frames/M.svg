<svg width="100%" height="100%" viewBox="0 0 1701 2480" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <rect x="0" y="0" width="1701" height="2480" style="fill:#31597f"/>
  <text x="850" y="400" font-size="150" text-anchor="middle" fill="#fff" font-family="sans-serif">M</text>
  <text x="850" y="880" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">Meeting frame named by J and K. When both</text>
  <text x="850" y="952" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">groups stand here they merge into one.</text>
  <text x="850" y="1024" font-size="46" text-anchor="middle" fill="#ffffff99" font-family="sans-serif">(The group from J waits by simply not voting.)</text>
  <a xlink:href="END.svg">
    <rect x="150" y="2160" width="1401" height="280" rx="36" style="fill:#e8e8f4;stroke:#223;stroke-width:6"/>
    <text x="850" y="2280" font-size="64" text-anchor="middle" fill="#112" font-family="sans-serif">Finish</text>
    <text x="850" y="2375" font-size="40" text-anchor="middle" fill="#556" font-family="sans-serif">END.svg</text>
  </a>
</svg>
